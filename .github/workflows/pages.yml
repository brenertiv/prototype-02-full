# Builds the prototype and deploys it to GitHub Pages on every push to main.
# A GitHub Pages site on a personal account is public to anyone with the URL,
# whatever the repo's visibility.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site is served at /<repo>/, so the app is built under that subpath.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Synthetic data only: Pages has no snapshot token and no password.
          VITE_BUILD_COMMIT: ${{ github.sha }}
      # GitHub Pages has no SPA fallback; serving the app as 404.html makes deep
      # links such as /<repo>/northwind/portfolio/people/team load the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
